```html

<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Centro de Reportes</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Roboto, Arial, sans-serif;
      background: #f4f6f8;
      color: #202124;
    }

      padding: 24px;

    }

      max-width: 760px;
      margin: auto;
    }

    .appbar h1 {
      margin: 0;
      font-size: 28px;

</head>

<body>

  <header class="appbar">

    <div class="appbar-content">

      <h1>Centro de Reportes</h1>

      <p>
        Reporta errores, solicita funcionalidades o envíanos tus sugerencias.
      </p>

    </div>

  </header>


  <main class="container">

    <div class="card">

      <div class="info">

        Tu reporte será enviado directamente a nuestro sistema de seguimiento.
        No necesitas tener una cuenta de GitHub.

      </div>


      <form id="issueForm">


        <!-- TIPO DE ISSUE -->

        <div class="field">

          <label for="type">
            Tipo de solicitud <span class="required">*</span>
          </label>

          <select id="type" required>

            <option value="">
              Selecciona una opción
            </option>

            <option value="bug">
              🐛 Reportar un error
            </option>

            <option value="features">
              ✨ Solicitar una funcionalidad
            </option>

            <option value="suggestion">
              💡 Enviar una sugerencia
            </option>

            

          </select>

        </div>


        <!-- PRODUCTO -->

        <div class="field">

          <label for="product">

            Producto <span class="required">*</span>

          </label>


          <select id="product" required>

            <option value="">
              Selecciona el producto
            </option>


            <!--
              AGREGA MÁS PRODUCTOS AQUÍ

              El value DEBE coincidir exactamente
              con el nombre de la label de GitHub.
            -->


            <option value="product: Facilweb">
              Facilweb
            </option>
            <option value="product: Flashnews">
              Flashnews
            </option>
            

            <!-- EJEMPLOS

            <option value="product: RadioNube">
              RadioNube
            </option>

            <option value="product: MiRadio.Link">
              MiRadio.Link
            </option>

            -->

          </select>

        </div>


        <!-- NOMBRE -->

        <div class="field">

          <label for="name">

            Tu nombre <span class="required">*</span>

          </label>

          <input
            type="text"
            id="name"
            placeholder="Ej: Juan Pérez"
            required
          >

        </div>


        <!-- EMAIL -->

        <div class="field">

          <label for="email">

            Correo electrónico <span class="required">*</span>

          </label>

          <input
            type="email"
            id="email"
            placeholder="nombre@ejemplo.com"
            required
          >

        </div>


        <!-- ASUNTO -->

        <div class="field">

          <label for="subject">

            Asunto <span class="required">*</span>

          </label>

          <input
            type="text"
            id="subject"
            placeholder="Resume brevemente tu reporte"
            required
          >

        </div>


        <!-- DESCRIPCIÓN -->

        <div class="field">

          <label for="description">

            Descripción <span class="required">*</span>

          </label>

          <textarea
            id="description"
            placeholder="Explica el problema, solicitud o sugerencia con todos los detalles posibles..."
            required
          ></textarea>

        </div>


        <button
          type="submit"
          class="button"
          id="submitButton"
        >
          Enviar reporte
        </button>


        <div id="message"></div>


      </form>

    </div>

  </main>


<script>

  /*
   * URL DE TU CLOUDFLARE WORKER
   */

  const WORKER_URL =
    "https://report-issue.altomarketing.workers.dev";


  const form =
    document.getElementById("issueForm");

  const button =
    document.getElementById("submitButton");

  const message =
    document.getElementById("message");


  form.addEventListener(
    "submit",
    async function(event) {

      event.preventDefault();


      message.className = "";

      message.style.display = "none";


      button.disabled = true;

      button.textContent =
        "Enviando...";


      /*
       * OBTENER DATOS
       */

      const data = {

        type:
          document
            .getElementById("type")
            .value,

        product:
          document
            .getElementById("product")
            .value,

        name:
          document
            .getElementById("name")
            .value
            .trim(),

        email:
          document
            .getElementById("email")
            .value
            .trim(),

        subject:
          document
            .getElementById("subject")
            .value
            .trim(),

        description:
          document
            .getElementById("description")
            .value
            .trim()

      };


      try {


        const response =
          await fetch(
            WORKER_URL,
            {

              method: "POST",

              headers: {

                "Content-Type":
                  "application/json"

              },

              body:
                JSON.stringify(data)

            }
          );


        const result =
          await response.json();


        if (
          !response.ok ||
          !result.success
        ) {

          throw new Error(
            result.error ||
            "No fue posible enviar el reporte."
          );

        }


        /*
         * ÉXITO
         */

        message.textContent =
          "✓ Tu reporte fue enviado correctamente. ¡Gracias por ayudarnos a mejorar!  El resultado podras verlo y monitorear fechas etc en este link veni.link/desarollo";

        message.className =
          "success";


        form.reset();


      }
      catch(error) {


        console.error(error);


        message.textContent =
          "✕ " +
          (
            error.message ||
            "Ocurrió un error al enviar el reporte."
          );


        message.className =
          "error";


      }


      button.disabled = false;

      button.textContent =
        "Enviar reporte";


    }
  );

</script>

</body>
</html>
