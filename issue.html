<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Centro de Reportes</title>

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/css/materialize.min.css">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
</head>

<body>

  <main>

    <header>
      <h1>Centro de Reportes</h1>

      <p>
        Desde este formulario podés reportar errores,
        solicitar funcionalidades, enviar sugerencias
        o realizar consultas.
      </p>
    </header>

    <section>

      <div>
        <strong>ℹ️ Información</strong>

        <p>
          Tu solicitud será registrada automáticamente
          en nuestro sistema de seguimiento.
          No necesitás tener una cuenta de GitHub.
        </p>
      </div>

      <form id="reportForm">

        <!-- Tipo de solicitud -->
        <div>
          <label for="type">
            Tipo de solicitud
          </label>

          <select id="type" name="type" required>
            <option value="">
              Seleccioná una opción
            </option>

            <option value="bug">
              🐛 Reportar un error
            </option>

            <option value="feature">
              ✨ Solicitar una funcionalidad
            </option>

            <option value="suggestion">
              💡 Enviar una sugerencia
            </option>

            <option value="question">
              ❓ Realizar una consulta
            </option>
          </select>
        </div>


        <!-- Producto -->
        <div>
          <label for="product">
            Producto
          </label>

          <select id="product" name="product" required>
            <option value="">
              Seleccioná el producto
            </option>

            <option value="product: Facilweb">
              Facilweb
            </option>
             <option value="product: Flashnews">
              Facilweb
            </option>
             <option value="product: Otraweb">
              Otraweb
            </option>
         
            <!--
              Para agregar nuevos productos:

              <option value="product: RadioNube">
                RadioNube
              </option>

              <option value="product: MiRadio.Link">
                MiRadio.Link
              </option>
            -->
          </select>
        </div>


        <!-- Nombre -->
        <div>
          <label for="name">
            Nombre
          </label>

          <input
            type="text"
            id="name"
            name="name"
            placeholder="Tu nombre"
            maxlength="100"
            required
          >
        </div>


        <!-- Asunto -->
        <div>
          <label for="subject">
            Asunto
          </label>

          <input
            type="text"
            id="subject"
            name="subject"
            placeholder="¿Cuál es el problema o solicitud?"
            maxlength="200"
            required
          >
        </div>


        <!-- Descripción -->
        <div>
          <label for="description">
            Descripción
          </label>

          <textarea
            id="description"
            name="description"
            rows="8"
            maxlength="10000"
            placeholder="Describí detalladamente el problema, sugerencia o consulta..."
            required
          ></textarea>
        </div>


        <!-- Botón -->
        <button
          type="submit"
          id="submitButton"
        >
          Enviar reporte
        </button>

      </form>


      <!-- Mensaje -->
      <div
        id="message"
        hidden
        role="alert"
      ></div>

    </section>

  </main>


<script>

  const WORKER_URL =
    "https://report-issue.altomarketing.workers.dev";


  const form =
    document.getElementById("reportForm");

  const submitButton =
    document.getElementById("submitButton");

  const message =
    document.getElementById("message");


  function escapeHtml(value) {

    return String(value)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#039;");

  }


  function showMessage(html, type) {

    message.hidden = false;

    message.innerHTML = html;

    message.dataset.type = type || "";

  }


  function hideMessage() {

    message.hidden = true;

    message.innerHTML = "";

  }


  form.addEventListener(
    "submit",
    async function(event) {

      event.preventDefault();

      hideMessage();

      submitButton.disabled = true;

      submitButton.textContent =
        "Enviando...";


      const data = {

        type:
          document.getElementById("type").value,

        product:
          document.getElementById("product").value,

        name:
          document.getElementById("name").value.trim(),

        subject:
          document.getElementById("subject").value.trim(),

        description:
          document.getElementById("description").value.trim()

      };


      const controller =
        new AbortController();

      const timeout =
        setTimeout(
          () => controller.abort(),
          20000
        );


      try {

        const response =
          await fetch(
            WORKER_URL,
            {
              method: "POST",

              headers: {
                "Content-Type":
                  "application/json"
              },

              body:
                JSON.stringify(data),

              signal:
                controller.signal
            }
          );


        const responseText =
          await response.text();


        let result;

        try {

          result =
            JSON.parse(responseText);

        } catch (jsonError) {

          throw new Error(
            "El servidor devolvió una respuesta inválida."
          );

        }


        if (!response.ok || !result.success) {

          throw new Error(
            result.error ||
            result.message ||
            `Error del servidor (${response.status})`
          );

        }


        const issueNumber =
          escapeHtml(result.issue_number);

        const issueUrl =
          escapeHtml(result.issue_url);


        showMessage(
          `
            <strong>
              🎉 ¡Gracias! Recibimos tu reporte
            </strong>

            <br><br>

            Tu solicitud fue registrada correctamente
            con el número
            <strong>#${issueNumber}</strong>.

            <br><br>

            Puedes guardar este enlace para consultar
            posteriormente el estado de tu reporte y
            las respuestas de nuestro equipo.

            <br><br>

            <a
              href="${issueUrl}"
              target="_blank"
              rel="noopener noreferrer"
            >
              Consultar mi reporte ↗
            </a>

            <br><br>

            <small>
              💡 No necesitas crear una cuenta para
              consultar tu reporte.
              Te recomendamos guardar este enlace.
            </small>
          `,
          "success"
        );


        form.reset();


      } catch (error) {

        if (error.name === "AbortError") {

          showMessage(
            `
              <strong>
                ⚠️ El servidor está tardando demasiado
              </strong>

              <br><br>

              El reporte podría estar procesándose.
              Esperá unos instantes antes de intentar
              enviarlo nuevamente.
            `,
            "error"
          );

        } else {

          showMessage(
            `
              <strong>
                ❌ No pudimos enviar el reporte
              </strong>

              <br><br>

              ${escapeHtml(error.message)}
            `,
            "error"
          );

        }

      } finally {

        clearTimeout(timeout);

        submitButton.disabled = false;

        submitButton.textContent =
          "Enviar reporte";

      }

    }
  );

</script>

</body>
</html>
